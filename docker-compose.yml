```yaml
services:
  zrok:
    image: ghcr.io/ilinyhgleb/zrok-share:dev

    environment:
      ZROK2_TARGET: http://n8n:5678
      ZROK2_MODE: public

    volumes:
      - ./zrok2:/home/ziggy/.zrok2:ro
      - ./zrok-shared:/home/ziggy/shared

    networks:
      - n8n-zrok

    restart: unless-stopped

    depends_on:
      n8n:
        condition: service_healthy


  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile

    user: "1000:1000"

    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 20

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Yekaterinburg}
      TZ: ${GENERIC_TIMEZONE:-Asia/Yekaterinburg}

    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./zrok-shared:/shared:ro

    ports:
      - "5678:5678"

    networks:
      - n8n-zrok

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  n8n-worker:
    build:
      context: ./n8n
      dockerfile: Dockerfile

    command: worker

    user: "1000:1000"

    environment:
      QUEUE_HEALTH_CHECK_ACTIVE: "true"

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 20

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Yekaterinburg}
      TZ: ${GENERIC_TIMEZONE:-Asia/Yekaterinburg}

    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./zrok-shared:/shared:ro

    networks:
      - n8n-zrok

    restart: unless-stopped

    depends_on:
      n8n:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/usr/local/bin/node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 10


  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - n8n-zrok

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  redis:
    image: redis:7

    networks:
      - n8n-zrok

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s


networks:
  n8n-zrok:


volumes:
  postgres-data:
```
